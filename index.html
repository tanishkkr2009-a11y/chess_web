
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Dark Chess game with take back functionality">

    <title>Dark Chess with Take Back</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: "Segoe UI", Tahoma, Geneva,
                         Verdana, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 {
            color: #bb86fc;
            margin-bottom: 10px;
            text-align: center;
        }

        #status {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);

            width: min(400px, 90vw);
            aspect-ratio: 1 / 1;

            border: 4px solid #333;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            user-select: none;

            width: 100%;
            height: 100%;
        }

        .square img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            pointer-events: none;
        }

        .light {
            background-color: #f0d9b5;
        }

        .dark {
            background-color: #b58863;
        }

        .selected {
            outline: 4px solid #bb86fc;
            outline-offset: -4px;
        }

        #takebackBtn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;

            color: #121212;
            background-color: #03dac6;

            border: none;
            border-radius: 4px;

            cursor: pointer;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }

        #takebackBtn:hover {
            background-color: #018786;
        }

        #takebackBtn:focus-visible {
            outline: 2px solid #bb86fc;
            outline-offset: 3px;
        }

        @media (max-width: 450px) {
            h1 {
                font-size: 1.6rem;
            }

            #status {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <h1>Dark Chess</h1>

    <div id="status"
         role="status"
         aria-live="polite">
        White's Turn
    </div>

    <main id="game-container">

        <div id="board"
             role="group"
             aria-label="Chessboard">
        </div>

        <button
            type="button"
            id="takebackBtn">
            Take Back Move
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
