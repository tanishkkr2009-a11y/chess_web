<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Chess with Take Back</title>
    <!-- Correct font awesome library link for icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #bb86fc;
            margin-bottom: 10px;
        }
        #status {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 100%;
        }
        #board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            user-select: none;
        }
        .light {
            background-color: #e0e4ec;
        }
        .dark {
            background-color: #70849c;
        }
        .piece {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .piece:hover {
            transform: scale(1.1);
        }
        .white-piece {
            color: #ffffff;
            filter: drop-shadow(0px 2px 2px rgba(0, 0, 0, 0.7));
        }
        .black-piece {
            color: #1a1a1a;
            filter: drop-shadow(0px 1px 1px rgba(255, 255, 255, 0.3));
        }
        .selected {
            background-color: #bb86fc !important;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #9965db;
        }
    </style>
</head>
<body>
    <h1>Dark Chess</h1>
    <div id="status">White's Turn</div>
    <div id="game-container">
        <div id="board"></div>
        <button id="takebackbtn">Take Back Move</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
